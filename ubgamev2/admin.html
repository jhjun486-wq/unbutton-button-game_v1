<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNBUTTON 관리자</title>
<style>body{font-family:Arial,"Noto Sans KR",sans-serif;background:#f4f0e8;margin:0;padding:24px;color:#171717}main{max-width:1000px;margin:auto}.card{background:#fff;border:2px solid #171717;padding:24px}input,button{padding:12px;font-size:15px}input{width:100%;max-width:400px}button{background:#171717;color:#fff;border:0}table{width:100%;border-collapse:collapse;margin-top:20px;background:#fff}th,td{text-align:left;border-bottom:1px solid #ddd;padding:12px;font-size:14px}.muted{opacity:.6;font-size:12px}.error{color:#b00020;margin-top:10px}</style></head>
<body><main><h1>UNBUTTON 관리자</h1><div class="card"><p>관리자 키를 입력하면 저장된 참가 기록을 확인할 수 있습니다.</p><input id="key" type="password" placeholder="ADMIN_KEY"><button onclick="load()">조회</button><div id="err" class="error"></div></div><div id="result"></div></main>
<script>
async function load(){let key=document.getElementById("key").value;let r=await fetch("/api/admin-scores",{headers:{Authorization:"Bearer "+key}});let d=await r.json();if(!r.ok){document.getElementById("err").textContent=d.error||"조회 실패";return}
document.getElementById("result").innerHTML=`<div class="card" style="margin-top:20px"><p class="muted">총 ${d.scores.length}건</p><table><thead><tr><th>순위</th><th>닉네임</th><th>전화번호</th><th>기록</th><th>동의 시각</th></tr></thead><tbody>${d.scores.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.nickname)}</td><td>${esc(s.phone)}</td><td><b>${Number(s.seconds).toFixed(2)}s</b></td><td>${esc(s.consentAt)}</td></tr>`).join("")}</tbody></table></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script></body></html>
