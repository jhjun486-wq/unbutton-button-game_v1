<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNBUTTON Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f4eadb;color:#111;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 18px}.box{background:#fff;border:2px solid #111;border-radius:16px;padding:18px;margin-top:16px}.input{width:100%;padding:13px;border:2px solid #111;border-radius:10px}.btn{margin-top:10px;border:2px solid #111;background:#111;color:#fff;padding:13px 18px;border-radius:999px;font-weight:800}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{padding:10px 6px;border-bottom:1px solid #bbb;text-align:left;font-size:13px}.err{color:#b00020;margin-top:10px}</style></head><body><div class="wrap"><h1>UNBUTTON ADMIN</h1><div class="box"><p>Supabase 관리자 계정으로 로그인하세요.</p><input id="email" class="input" placeholder="관리자 이메일" type="email"><br><br><input id="password" class="input" placeholder="비밀번호" type="password"><button class="btn" onclick="login()">로그인</button><div id="msg" class="err"></div></div><div id="data" class="box" style="display:none"><button class="btn" onclick="load()">새로고침</button><div id="table"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://odocufrmybizooxecphn.supabase.co','sb_publishable_XZGCRCDVWLB-96_NpZQ3sw_3aiD-YhI');async function login(){const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent='로그인 실패: '+error.message;return}msg.textContent='';data.style.display='block';load()}async function load(){const {data,error}=await sb.from('scores').select('nickname,email,seconds,consent_at').order('seconds',{ascending:true});if(error){table.innerHTML='<div class="err">불러오기 실패</div>';return}table.innerHTML='<table><thead><tr><th>순위</th><th>닉네임</th><th>이메일</th><th>기록</th><th>동의 시각</th></tr></thead><tbody>'+data.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.nickname)}</td><td>${esc(r.email)}</td><td>${Number(r.seconds).toFixed(2)}s</td><td>${esc(r.consent_at)}</td></tr>`).join('')+'</tbody></table>'}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}</script></body></html>
