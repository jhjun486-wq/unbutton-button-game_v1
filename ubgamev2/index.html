<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UNBUTTON 2027 — BUTTON GAME</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f4eadb;color:#111;font-family:Arial,"Noto Sans KR",sans-serif}button,input{font:inherit}body{min-height:100vh}.wrap{max-width:720px;margin:auto;padding:24px 18px}.screen{min-height:calc(100vh - 48px);display:none;flex-direction:column;justify-content:center}.screen.active{display:flex}.logo{font-weight:900;letter-spacing:.08em;font-size:14px;margin-bottom:22px}.title{font-size:clamp(42px,12vw,88px);line-height:.9;font-weight:900;letter-spacing:-.06em}.sub{font-size:15px;line-height:1.6;margin:22px 0 30px}.btn{border:2px solid #111;background:#111;color:#fff;padding:16px 20px;border-radius:999px;cursor:pointer;font-weight:800}.btn.alt{background:transparent;color:#111}.input{width:100%;border:2px solid #111;background:#fff;padding:16px;border-radius:12px;outline:none}.field{margin:12px 0}.label{font-size:13px;font-weight:800;margin-bottom:7px}.gamehead{display:flex;justify-content:space-between;font-weight:900;margin-bottom:12px}.arena{position:relative;height:62vh;min-height:420px;border:2px solid #111;background:#fff;border-radius:18px;overflow:hidden}.dot{position:absolute;width:46px;height:46px;border:2px solid #111;background:#f4eadb;border-radius:50%;cursor:pointer;font-weight:900}.center{text-align:center}.rank{display:flex;justify-content:space-between;border-bottom:1px solid #bbb;padding:12px 0}.small{font-size:12px;color:#555}.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45;margin:14px 0}.error{color:#b00020;font-size:13px;min-height:20px}.link{margin-top:18px;color:#111;text-decoration:underline;cursor:pointer}.hidden{display:none}
</style>
</head>
<body><main class="wrap">
<section id="start" class="screen active"><div class="logo">UNBUTTON 2027</div><div class="title">BUTTON<br>GAME</div><p class="sub">30개의 단추를 최대한 빠르게 풀어주세요.<br>당신의 기록에 도전하세요.</p><button class="btn" onclick="go('nickname')">START</button></section>
<section id="nickname" class="screen"><div class="logo">WHO ARE YOU?</div><h2>닉네임을 입력해주세요.</h2><div class="field"><input id="nicknameInput" class="input" maxlength="12" placeholder="최대 12자"></div><div id="nickError" class="error"></div><button class="btn" onclick="startGame()">게임 시작</button></section>
<section id="game" class="screen"><div class="gamehead"><span id="playerLabel"></span><span id="timer">0.00s</span></div><div id="arena" class="arena"></div></section>
<section id="info" class="screen"><div class="logo">RECORD SAVED</div><h2>기록이 완성됐어요.</h2><p class="sub">최고 기록에 등록하려면 이메일을 입력해주세요.</p><div class="field"><div class="label">이메일</div><input id="email" class="input" type="email" placeholder="이메일을 입력해주세요"></div><label class="check"><input id="consent" type="checkbox"> 개인정보 수집 및 이용에 동의합니다. 기록 확인 및 이벤트 안내를 위해 이메일을 수집합니다.</label><div id="infoError" class="error"></div><button class="btn" onclick="submitScore()">기록 등록</button><div class="link" onclick="showLeaderboard()">기록 등록 없이 랭킹 보기</div></section>
<section id="leaderboard" class="screen"><div class="logo">HIGHEST RECORD</div><h1>TOP 10</h1><div id="board"></div><p id="boardError" class="error"></p><button class="btn" onclick="go('start')">다시 하기</button><a class="link" href="admin.html">관리자</a></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://odocufrmybizooxecphn.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_XZGCRCDVWLB-96_NpZQ3sw_3aiD-YhI';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let nickname='',started=0,timerId=null,count=0,record=0;
const $=id=>document.getElementById(id);
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
function startGame(){nickname=$('nicknameInput').value.trim();if(!nickname){$('nickError').textContent='닉네임을 입력해주세요.';return}$('nickError').textContent='';$('playerLabel').textContent=nickname;go('game');buildGame()}
function buildGame(){const a=$('arena');a.innerHTML='';count=0;started=performance.now();$('timer').textContent='0.00s';for(let i=0;i<30;i++){const b=document.createElement('button');b.className='dot';b.textContent='';b.style.left=(Math.random()*88+4)+'%';b.style.top=(Math.random()*88+4)+'%';b.onclick=()=>{b.remove();count++;if(count===1){}if(count===30)finish()};a.appendChild(b)}clearInterval(timerId);timerId=setInterval(()=>{$('timer').textContent=((performance.now()-started)/1000).toFixed(2)+'s'},20)}
function finish(){clearInterval(timerId);record=Number(((performance.now()-started)/1000).toFixed(2));$('timer').textContent=record.toFixed(2)+'s';setTimeout(()=>go('info'),300)}
async function submitScore(){const email=$('email').value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ $('infoError').textContent='이메일을 정확히 입력해주세요.';return}if(!$('consent').checked){$('infoError').textContent='개인정보 수집 및 이용에 동의해주세요.';return}$('infoError').textContent='등록 중...';const {error}=await sb.from('scores').insert({nickname,email,seconds:record,consent_at:new Date().toISOString()});if(error){$('infoError').textContent='등록에 실패했습니다. 잠시 후 다시 시도해주세요.';console.error(error);return}showLeaderboard()}
async function showLeaderboard(){go('leaderboard');$('board').innerHTML='불러오는 중...';const {data,error}=await sb.from('leaderboard').select('nickname,seconds').limit(10);if(error){$('board').innerHTML='';$('boardError').textContent='랭킹을 불러오지 못했습니다.';return}$('boardError').textContent='';$('board').innerHTML=data.length?data.map((r,i)=>`<div class="rank"><span>${i+1}. ${escapeHtml(r.nickname)}</span><b>${Number(r.seconds).toFixed(2)}s</b></div>`).join(''):'아직 등록된 기록이 없습니다.'}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>
