<!doctype html>
<html lang="ko">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>풀어라! 단추</title>

<!-- 픽셀 한글 폰트 -->
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css"
>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  background:#090909;
  color:#f7f7f7;
  font-family:"Galmuri11","Courier New",monospace;
  image-rendering:pixelated;
}

body{
  min-height:100vh;
}

button,
input{
  font:inherit;
}

.wrap{
  max-width:720px;
  margin:auto;
  padding:24px 18px;
}

.screen{
  min-height:calc(100vh - 48px);
  display:none;
  flex-direction:column;
  justify-content:center;
}

.screen.active{
  display:flex;
}

.logo{
  font-weight:900;
  letter-spacing:.12em;
  font-size:13px;
  margin-bottom:22px;
  color:#f7f7f7;
  text-transform:uppercase;
}

/* 메인 타이틀 */
.title{
  font-size:clamp(42px,12vw,88px);
  line-height:1;
  font-weight:900;
  letter-spacing:-.08em;
  color:#ff3340;
  white-space:nowrap;
  text-shadow:4px 4px 0 #4d1115;
}

.sub{
  font-size:15px;
  line-height:1.7;
  margin:28px 0 30px;
  font-weight:700;
  color:#f7f7f7;
}

/* 버튼 */
.btn{
  border:3px solid #f7f7f7;
  background:#f7f7f7;
  color:#090909;
  padding:15px 20px;
  border-radius:0;
  cursor:pointer;
  font-weight:900;
  box-shadow:5px 5px 0 #ff3340;
  transition:
    transform .08s,
    box-shadow .08s;
}

.btn:hover{
  transform:translate(2px,2px);
  box-shadow:3px 3px 0 #ff3340;
}

.btn:active{
  transform:translate(5px,5px);
  box-shadow:none;
}

.btn.alt{
  background:transparent;
  color:#f7f7f7;
}

/* 입력창 */
.input{
  width:100%;
  border:3px solid #f7f7f7;
  background:#111;
  color:#f7f7f7;
  padding:15px;
  border-radius:0;
  outline:none;
}

.input:focus{
  border-color:#ff3340;
  box-shadow:4px 4px 0 #ff3340;
}

.field{
  margin:12px 0;
}

.label{
  font-size:13px;
  font-weight:800;
  margin-bottom:7px;
}

/* 게임 상단 */
.gamehead{
  display:flex;
  justify-content:space-between;
  font-weight:900;
  margin-bottom:12px;
  color:#ff3340;
  font-size:16px;
}

/* 게임 영역 */
.arena{
  position:relative;
  height:62vh;
  min-height:420px;
  border:4px solid #f7f7f7;
  background:#f7f7f7;
  border-radius:0;
  overflow:hidden;
  box-shadow:8px 8px 0 #ff3340;
}

/* 단추 */
.dot{
  position:absolute;
  width:44px;
  height:44px;
  border:3px solid #090909;
  background:#ff3340;
  border-radius:50%;
  cursor:pointer;
  font-weight:900;
  padding:0;
  box-shadow:4px 4px 0 #090909;
  transition:
    transform .06s,
    box-shadow .06s;
}

.dot:active{
  transform:translate(4px,4px);
  box-shadow:none;
}

.center{
  text-align:center;
}

/* 랭킹 */
.rank{
  display:flex;
  justify-content:space-between;
  border-bottom:2px solid #f7f7f7;
  padding:12px 0;
  font-weight:700;
}

/* 1위 + 2위 빨간색 */
.rank:nth-child(1),
.rank:nth-child(2){
  color:#ff3340;
}

.small{
  font-size:12px;
  color:#aaa;
}

.check{
  display:flex;
  gap:8px;
  align-items:flex-start;
  font-size:13px;
  line-height:1.45;
  margin:14px 0;
}

.check input{
  accent-color:#ff3340;
  width:16px;
  height:16px;
}

.error{
  color:#ff7b83;
  font-size:13px;
  min-height:20px;
  font-weight:700;
}

.link{
  margin-top:18px;
  color:#f7f7f7;
  text-decoration:underline;
  cursor:pointer;
}

.hidden{
  display:none;
}

h1,
h2{
  font-family:"Galmuri11","Courier New",monospace;
  letter-spacing:-.05em;
}

/* 8-bit 스캔라인 효과 */
.screen.active::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:999;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.018) 0px,
      rgba(255,255,255,.018) 1px,
      transparent 1px,
      transparent 4px
    );
}

</style>

</head>

<body>

<!-- =========================
     배경음 / 효과음
========================= -->

<audio
  id="bgMusic"
  src="dreamy-bg.mp3"
  loop
  preload="auto">
</audio>

<audio
  id="buttonSfx"
  src="button-pop.mp3"
  preload="auto">
</audio>


<main class="wrap">


<!-- =========================
     START
========================= -->

<section
  id="start"
  class="screen active"
>

  <div class="logo">
    UNBUTTON 2027
  </div>

  <div class="title">
    풀어라! 단추
  </div>

  <p class="sub">
    30개의 단추를 최대한 빠르게 풀어주세요.<br>
    최고 기록에 도전하세요!
  </p>

  <button
    class="btn"
    onclick="go('nickname')"
  >
    START
  </button>

</section>


<!-- =========================
     NICKNAME
========================= -->

<section
  id="nickname"
  class="screen"
>

  <div class="logo">
    WHO ARE YOU?
  </div>

  <h2 style="color:#fff">
    닉네임을 입력해주세요.
  </h2>

  <div class="field">

    <input
      id="nicknameInput"
      class="input"
      maxlength="12"
      placeholder="최대 12자"
    >

  </div>

  <div
    id="nickError"
    class="error"
  ></div>

  <button
    class="btn"
    onclick="startGame()"
  >
    게임 시작
  </button>

</section>


<!-- =========================
     GAME
========================= -->

<section
  id="game"
  class="screen"
>

  <div class="gamehead">

    <span id="playerLabel"></span>

    <span id="timer">
      0.00s
    </span>

  </div>

  <div
    id="arena"
    class="arena"
  ></div>

</section>


<!-- =========================
     INFO
========================= -->

<section
  id="info"
  class="screen"
>

  <div class="logo">
    RECORD SAVED
  </div>

  <h2 style="color:#fff">
    기록이 완성됐어요.
  </h2>

  <p class="sub">
    최고 기록에 등록하려면<br>
    이메일을 입력해주세요.
  </p>

  <div class="field">

    <div class="label">
      이메일
    </div>

    <input
      id="email"
      class="input"
      type="email"
      inputmode="email"
      autocomplete="email"
      placeholder="이메일을 입력해주세요"
    >

  </div>

  <label class="check">

    <input
      id="consent"
      type="checkbox"
    >

    <span>
      개인정보 수집 및 이용에 동의합니다.
      기록 확인 및 이벤트 안내를 위해 이메일을 수집합니다.
    </span>

  </label>

  <div
    id="infoError"
    class="error"
  ></div>

  <button
    class="btn"
    onclick="submitScore()"
  >
    기록 등록
  </button>

  <div
    class="link"
    onclick="showLeaderboard()"
  >
    기록 등록 없이 랭킹 보기
  </div>

</section>


<!-- =========================
     LEADERBOARD
========================= -->

<section
  id="leaderboard"
  class="screen"
>

  <div class="logo">
    HIGHEST RECORD
  </div>

  <h1 style="color:#fff">
    TOP 10
  </h1>

  <div id="board">
    불러오는 중...
  </div>

  <p
    id="boardError"
    class="error"
  ></p>

  <button
    class="btn"
    onclick="go('start')"
  >
    다시 하기
  </button>

</section>

</main>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  'https://odocufrmybizooxecphn.supabase.co';

const SUPABASE_ANON_KEY =
  'sb_publishable_XZGCRCDVWLB-96_NpZQ3sw_3aiD-YhI';

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================
   GAME VARIABLES
========================= */

let nickname = '';

let started = 0;

let timerId = null;

let count = 0;

let record = 0;


/* =========================
   SHORTCUT
========================= */

const $ = id =>
  document.getElementById(id);


/* =========================
   BGM
========================= */

function playBGM(){

  const bg =
    $('bgMusic');

  bg.volume = 0.38;

  bg.loop = true;

  bg.play().catch(err => {

    console.log(
      '자동재생이 차단되었습니다. 첫 사용자 입력 후 재생합니다.',
      err
    );

  });

}


/* =========================
   PAGE CHANGE
========================= */

function go(id){

  document
    .querySelectorAll('.screen')
    .forEach(x =>
      x.classList.remove('active')
    );

  $(id).classList.add('active');

}


/* =========================
   START GAME
========================= */

function startGame(){

  nickname =
    $('nicknameInput')
      .value
      .trim();


  if(!nickname){

    $('nickError').textContent =
      '닉네임을 입력해주세요.';

    return;

  }


  $('nickError').textContent = '';

  $('playerLabel').textContent =
    nickname;


  /* BGM 재생 */

  playBGM();


  /* 게임 화면 */

  go('game');

  buildGame();

}


/* =========================
   BUILD GAME
========================= */

function buildGame(){

  const a =
    $('arena');


  a.innerHTML = '';

  count = 0;

  started =
    performance.now();


  $('timer').textContent =
    '0.00s';


  /* 30개의 단추 생성 */

  for(let i = 0; i < 30; i++){

    const b =
      document.createElement('button');


    b.className =
      'dot';


    b.setAttribute(
      'aria-label',
      '단추'
    );


    b.textContent = '';


    /* 랜덤 위치 */

    b.style.left =
      (Math.random() * 88 + 4) + '%';

    b.style.top =
      (Math.random() * 88 + 4) + '%';


    /* 클릭 */

    b.onclick = () => {

      const sfx =
        $('buttonSfx');


      /* 효과음 */

      sfx.currentTime = 0;

      sfx.volume = 0.65;

      sfx.play().catch(err => {

        console.log(
          '효과음 재생 실패:',
          err
        );

      });


      /* 단추 제거 */

      b.remove();

      count++;


      /* 30개 모두 제거 */

      if(count === 30){

        finish();

      }

    };


    a.appendChild(b);

  }


  /* 기존 타이머 제거 */

  clearInterval(timerId);


  /* 타이머 시작 */

  timerId =
    setInterval(() => {

      $('timer').textContent =
        (
          (performance.now() - started)
          / 1000
        ).toFixed(2) + 's';

    },20);

}


/* =========================
   FINISH
========================= */

function finish(){

  clearInterval(timerId);


  record =
    Number(
      (
        (performance.now() - started)
        / 1000
      ).toFixed(2)
    );


  $('timer').textContent =
    record.toFixed(2) + 's';


  /*
    BGM을 여기서 끄지 않음.
    게임 종료 후에도 계속 재생.
  */


  setTimeout(() =>
    go('info'),
    300
  );

}


/* =========================
   SUBMIT SCORE
========================= */

async function submitScore(){

  /*
    BGM을 끄지 않음.
  */


  const email =
    $('email')
      .value
      .trim();


  $('infoError').textContent = '';


  /* 이메일 확인 */

  if(
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
      .test(email)
  ){

    $('infoError').textContent =
      '이메일을 정확히 입력해주세요.';

    return;

  }


  /* 개인정보 동의 확인 */

  if(!$('consent').checked){

    $('infoError').textContent =
      '개인정보 수집 및 이용에 동의해주세요.';

    return;

  }


  $('infoError').textContent =
    '등록 중...';


  /* Supabase 저장 */

  const {error} =
    await sb
      .from('scores')
      .insert({

        nickname,

        email,

        seconds: record,

        consent_at:
          new Date().toISOString()

      });


  /* 오류 */

  if(error){

    $('infoError').textContent =
      '등록에 실패했습니다. 잠시 후 다시 시도해주세요.';

    console.error(error);

    return;

  }


  /* 랭킹 */

  showLeaderboard();

}


/* =========================
   LEADERBOARD
========================= */

async function showLeaderboard(){

  /*
    BGM을 끄지 않음.
  */


  go('leaderboard');


  $('board').innerHTML =
    '불러오는 중...';


  const {data,error} =
    await sb
      .from('leaderboard')
      .select(
        'nickname,seconds'
      )
      .order(
        'seconds',
        {
          ascending:true
        }
      )
      .limit(10);


  /* 오류 */

  if(error){

    $('board').innerHTML = '';

    $('boardError').textContent =
      '랭킹을 불러오지 못했습니다.';

    console.error(error);

    return;

  }


  $('boardError').textContent = '';


  /* 기록 없음 */

  if(
    !data ||
    data.length === 0
  ){

    $('board').innerHTML =
      '아직 등록된 기록이 없습니다.';

    return;

  }


  /* 랭킹 표시 */

  $('board').innerHTML =
    data.map((r,i) => `

      <div class="rank">

        <span>
          ${i+1}.
          ${escapeHtml(r.nickname)}
        </span>

        <b>
          ${Number(r.seconds).toFixed(2)}s
        </b>

      </div>

    `).join('');

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(s){

  return s.replace(
    /[&<>'"]/g,

    c => ({

      '&':'&amp;',

      '<':'&lt;',

      '>':'&gt;',

      "'":'&#39;',

      '"':'&quot;'

    }[c])

  );

}


/* =========================
   PAGE LOAD
   타이틀 화면부터 BGM 재생 시도
========================= */

window.addEventListener(
  'DOMContentLoaded',
  () => {

    playBGM();

  }
);


/* =========================
   첫 사용자 입력 시 BGM 재생
   자동재생 차단 대비
========================= */

document.addEventListener(
  'click',
  () => {

    const bg =
      $('bgMusic');

    if(bg.paused){

      bg.play().catch(() => {});

    }

  },
  {
    once:false
  }
);

</script>

</body>
</html>
